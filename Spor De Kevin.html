<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Spor</title>
<style>
:root{
  --bg:#08090c; --card:#11131a; --card2:#171a22; --text:#f4f5f7;
  --muted:#9da3b0; --accent:#ff334d; --accent2:#ff6478; --line:#272b35;
  --good:#35d07f; --bad:#ff5964;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:radial-gradient(circle at top right,#261018 0,#0b0c10 34%,#07080a 70%);
  color:var(--text);min-height:100vh;
}
header{
  position:sticky;top:0;z-index:5;background:rgba(8,9,12,.88);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.nav{max-width:1100px;margin:auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:900;letter-spacing:.4px}.logo span{color:var(--accent)}
.today{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:auto;padding:30px 20px 60px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}
h1{margin:0;font-size:clamp(28px,5vw,44px);line-height:1.05}
.subtitle{color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}
.stat{background:linear-gradient(145deg,var(--card),#0d0f14);border:1px solid var(--line);border-radius:16px;padding:17px}
.stat b{font-size:24px;display:block}.stat small{color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}
.section-title h2{margin:0;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.exercise{
  background:linear-gradient(145deg,#12151c,#0d0f14);border:1px solid var(--line);
  border-radius:18px;padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden
}
.exercise:hover{transform:translateY(-2px);border-color:#454a57}
.exercise::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;background:rgba(255,51,77,.08);border-radius:50%}
.ex-top{display:flex;justify-content:space-between;gap:10px}
.name{font-weight:800;font-size:18px}.target{color:var(--accent2);font-size:13px;font-weight:700}
.last{margin-top:14px;color:var(--muted);font-size:13px}.last strong{color:var(--text);font-size:17px}
.progress{height:5px;background:#242832;border-radius:99px;margin-top:13px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.empty{padding:24px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center;grid-column:1/-1}
button{
  border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;
  background:var(--accent);color:white
}
button.secondary{background:#20242d;color:#e9ebef;border:1px solid var(--line)}
button.danger{background:#32151a;color:#ff8d98;border:1px solid #552027}
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;
  align-items:center;justify-content:center;padding:18px
}
.modal-bg.show{display:flex}
.modal{width:min(560px,100%);background:#101219;border:1px solid #303541;border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.5);padding:22px;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:start;gap:12px}
.modal h3{margin:0;font-size:24px}.close{background:transparent;font-size:24px;padding:0;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
label{font-size:12px;color:var(--muted);font-weight:700}
input{
  width:100%;margin-top:6px;background:#181b23;color:var(--text);border:1px solid #303541;
  border-radius:12px;padding:13px;font-size:16px;outline:none
}
input:focus{border-color:var(--accent)}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:9px;margin-top:16px}.actions button{flex:1}
.history{margin-top:20px}.history h4{margin:0 0 10px}
.table{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:10px 12px;font-size:13px;border-top:1px solid var(--line)}
.row:first-child{border-top:0;background:#171a22;color:var(--muted);font-weight:800}
.row:not(:first-child){color:#dfe2e8}
.chart-wrap{margin-top:16px;border:1px solid var(--line);border-radius:15px;padding:12px;background:#0c0e13}
canvas{width:100%;height:220px;display:block}
.change{margin-top:10px;font-size:13px}.up{color:var(--good)}.down{color:var(--bad)}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:14px}
@media(max-width:700px){
  .stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}
  .grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.today{display:none}
}
</style>
</head>
<body>
<header><div class="nav">
  <div class="logo">KEVİN <span>SPOR</span> 💪</div>
  <div class="today" id="today"></div>
</div></header>

<main>
  <div class="hero">
    <div><h1>Bugünkü Program</h1><div class="subtitle">Ağırlıklarını kaydet, gelişimini takip et.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button class="secondary" onclick="exportData()">Yedekle</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">Geri Yükle</button>
      <button class="danger" onclick="clearAll()">Verileri Sıfırla</button>
      <input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)">
    </div>
  </div>
  <div style="color:var(--muted);font-size:12px;margin:-10px 0 18px">Sadece Miraç'a özel.</div>

  <div class="stats">
    <div class="stat"><b id="statExercises">8</b><small>Hareket</small></div>
    <div class="stat"><b id="statDone">0</b><small>Bugün kayıt</small></div>
    <div class="stat"><b id="statBest">—</b><small>En yüksek kilo</small></div>
  </div>

  <div class="section-title"><h2>Programın</h2><span class="today">Her hareket 3 × 12</span></div>
  <div class="grid" id="exerciseGrid"></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="modalTitle"></h3><div class="subtitle" id="modalTarget"></div></div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <form id="entryForm" onsubmit="saveEntry(event)">
      <div class="form">
        <div><label>Tarih<input id="date" type="date" required></label></div>
        <div><label>Kilo (kg)<input id="weight" type="number" min="0" step="0.5" required></label></div>
        <div><label>Set<input id="sets" type="number" min="1" value="3" required></label></div>
        <div><label>Tekrar<input id="reps" type="number" min="1" value="12" required></label></div>
        <div class="full"><label>Not (opsiyonel)<input id="note" type="text" maxlength="120" placeholder="Örn. Son sette zorlandım"></label></div>
      </div>
      <div class="actions">
        <button type="submit">KAYDET</button>
        <button type="button" class="secondary" onclick="closeModal()">İPTAL</button>
      </div>
    </form>

    <div class="history">
      <h4>📈 Gelişim</h4>
      <div class="chart-wrap"><canvas id="chart" width="520" height="220"></canvas></div>
      <div id="change" class="change"></div>
      <div class="table" id="historyTable"></div>
    </div>
    <div class="note">Kayıtlar bu tarayıcıda saklanır (localStorage). Siteyi kapatıp açsan da verilerin kalır.</div>
  </div>
</div>

<script>
const exercises = [
  "Chest Press","Butterfly Machine","Lat Pulldown","Seated Cable Row",
  "Shoulder Press Machine","Leg Press","Pushdown","Cable Curl"
];
const key="myWorkoutTrackerV2";
const dbName="MyWorkoutTrackerDB";
const dbStore="workoutData";
let data={};
let selected="";

function localRead(){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch(e){return {}}}
function localWrite(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){return false}}
function openDB(){
  return new Promise(resolve=>{
    if(!("indexedDB" in window)){resolve(null);return}
    const r=indexedDB.open(dbName,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(dbStore))r.result.createObjectStore(dbStore)};
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>resolve(null);
  });
}
async function persistData(){
  localWrite();
  const db=await openDB();
  if(!db)return;
  try{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(dbStore,"readwrite");
      tx.objectStore(dbStore).put(data,"all");
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
  }catch(e){}
  db.close();
}
async function loadData(){
  const local=localRead();
  data=local;
  const db=await openDB();
  if(db){
    try{
      const saved=await new Promise((resolve,reject)=>{
        const tx=db.transaction(dbStore,"readonly");
        const r=tx.objectStore(dbStore).get("all");
        r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
      });
      if(saved && typeof saved==="object"){data=saved;localWrite()}
      else if(Object.keys(local).length) await persistData();
    }catch(e){}
    db.close();
  }
  render();
}

document.getElementById("today").textContent=new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
document.getElementById("date").value=new Date().toISOString().slice(0,10);

function save(){persistData();}
function getList(name){return data[name]||[];}
function latest(name){let a=getList(name);return a.length?a[a.length-1]:null;}

function render(){
  const grid=document.getElementById("exerciseGrid");
  grid.innerHTML="";
  let done=0,best=0;
  exercises.forEach(name=>{
    const a=getList(name); const l=latest(name);
    if(a.some(x=>x.date===new Date().toISOString().slice(0,10))) done++;
    a.forEach(x=>best=Math.max(best,Number(x.weight)||0));
    const max=Math.max(...a.map(x=>Number(x.weight)||0),0);
    const pct=max?Math.min(100,((Number(l?.weight)||0)/max)*100):0;
    grid.innerHTML+=`
      <div class="exercise" onclick="openModal('${name.replaceAll("'","\\'")}')">
        <div class="ex-top"><div class="name">${name}</div><div class="target">3 × 12</div></div>
        <div class="last">Son kayıt: <strong>${l?l.weight+" kg":"Henüz yok"}</strong></div>
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>`;
  });
  document.getElementById("statExercises").textContent=exercises.length;
  document.getElementById("statDone").textContent=done;
  document.getElementById("statBest").textContent=best?best+" kg":"—";
}
function openModal(name){
  selected=name; document.getElementById("modalTitle").textContent=name;
  const a=getList(name), l=latest(name);
  document.getElementById("modalTarget").textContent="Program: 3 set × 12 tekrar";
  document.getElementById("date").value=new Date().toISOString().slice(0,10);
  document.getElementById("weight").value=l?.weight||"";
  document.getElementById("sets").value=l?.sets||3;
  document.getElementById("reps").value=l?.reps||12;
  document.getElementById("note").value="";
  document.getElementById("modalBg").classList.add("show");
  renderHistory();
}
function closeModal(){document.getElementById("modalBg").classList.remove("show");selected="";}
function saveEntry(e){
  e.preventDefault();
  if(!selected)return;
  if(!data[selected])data[selected]=[];
  data[selected].push({
    date:document.getElementById("date").value,
    weight:Number(document.getElementById("weight").value),
    sets:Number(document.getElementById("sets").value),
    reps:Number(document.getElementById("reps").value),
    note:document.getElementById("note").value.trim()
  });
  data[selected].sort((a,b)=>a.date.localeCompare(b.date));
  save(); render(); renderHistory();
  document.getElementById("weight").value="";
  document.getElementById("note").value="";
}
function renderHistory(){
  const a=getList(selected);
  const table=document.getElementById("historyTable");
  if(!a.length){table.innerHTML='<div class="row"><span>Tarih</span><span>Kilo</span><span>Set × Tekrar</span><span>Not</span></div><div class="row"><span colspan="4">Henüz kayıt yok</span></div>'; drawChart([]); document.getElementById("change").textContent="";return;}
  table.innerHTML='<div class="row"><span>Tarih</span><span>Kilo</span><span>Set × Tekrar</span><span>Not</span></div>'+
    a.slice().reverse().map(x=>`<div class="row"><span>${formatDate(x.date)}</span><span>${x.weight} kg</span><span>${x.sets} × ${x.reps}</span><span>${x.note||"—"}</span></div>`).join("");
  drawChart(a);
  if(a.length>=2){
    const diff=a[a.length-1].weight-a[a.length-2].weight;
    const el=document.getElementById("change");
    el.className="change "+(diff>0?"up":diff<0?"down":"");
    el.textContent=diff>0?`⬆️ Önceki kayda göre +${diff} kg`:diff<0?`⬇️ Önceki kayda göre ${diff} kg`:"➡️ Önceki kayıtla aynı kilo";
  }
}
function formatDate(s){return new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function drawChart(a){
  const c=document.getElementById("chart"),ctx=c.getContext("2d"),dpr=devicePixelRatio||1;
  const w=c.clientWidth||520,h=220;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  if(!a.length){ctx.fillStyle="#777d88";ctx.font="14px system-ui";ctx.textAlign="center";ctx.fillText("Kayıt eklediğinde grafik burada görünecek.",w/2,h/2);return;}
  const pad={l:42,r:16,t:18,b:32}, max=Math.max(...a.map(x=>x.weight)), min=Math.min(...a.map(x=>x.weight));
  const lo=Math.max(0,min-5), hi=Math.max(max+5,lo+10);
  const X=i=>pad.l+(a.length===1?(w-pad.l-pad.r)/2:i*(w-pad.l-pad.r)/(a.length-1));
  const Y=v=>h-pad.b-(v-lo)*(h-pad.t-pad.b)/(hi-lo);
  ctx.strokeStyle="#272b35";ctx.lineWidth=1;
  for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;ctx.beginPath();ctx.moveTo(pad.l,Y(v));ctx.lineTo(w-pad.r,Y(v));ctx.stroke();ctx.fillStyle="#777d88";ctx.font="11px system-ui";ctx.fillText(v.toFixed(1)+" kg",2,Y(v)+4);}
  ctx.strokeStyle="#ff334d";ctx.lineWidth=3;ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();
  a.forEach((x,i)=>i?ctx.lineTo(X(i),Y(x.weight)):ctx.moveTo(X(i),Y(x.weight)));ctx.stroke();
  a.forEach((x,i)=>{ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(X(i),Y(x.weight),4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ff334d";ctx.beginPath();ctx.arc(X(i),Y(x.weight),2.5,0,Math.PI*2);ctx.fill();});
}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="my-workout-yedek-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const imported=JSON.parse(reader.result);
      if(!imported || typeof imported!=="object" || Array.isArray(imported))throw new Error();
      data=imported; await persistData(); render();
      if(selected)renderHistory();
      alert("Yedek başarıyla geri yüklendi.");
    }catch(e){alert("Geçerli bir workout yedeği seç.");}
    event.target.value="";
  };
  reader.readAsText(file);
}
function clearAll(){
  if(confirm("Tüm kayıtlar silinsin mi? Bu işlem geri alınamaz.")){data={};save();render();if(selected)renderHistory();}
}
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});
window.addEventListener("resize",()=>{if(selected)drawChart(getList(selected));});
loadData();
</script>
</body>
</html>
